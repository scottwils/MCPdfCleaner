name: Build Windows .exe

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:       # Manual "Run workflow" button — always available
  pull_request:             # PR check; produces .exe artifact for any branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --console --name MCPdfCleaner mc_pdf_cleaner.py

      - name: Verify build output
        shell: bash
        run: |
          ls -la dist/
          file dist/MCPdfCleaner.exe
          if [ ! -s "dist/MCPdfCleaner.exe" ]; then
            echo "::error::MCPdfCleaner.exe was not produced or is empty."
            exit 1
          fi

      - name: Smoke test (.exe --help / banner)
        shell: bash
        run: |
          cd dist
          # The script reads input.pdf and writes a -clean.pdf; running without
          # args just prompts, so we feed an empty stdin to ensure it at least
          # imports and starts without error. We don't need a real PDF.
          timeout 10 ./MCPdfCleaner.exe < /dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPdfCleaner-windows
          path: dist/MCPdfCleaner.exe
          if-no-files-found: error
          retention-days: 30
